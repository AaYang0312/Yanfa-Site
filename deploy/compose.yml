services:
  yuanfa:
    image: ${YUANFA_IMAGE:-yuanfa-official:content-platform-20261106}
    build:
      context: ..
      dockerfile: Dockerfile
    user: "1000:1000"
    read_only: true
    restart: unless-stopped
    stop_grace_period: 330s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      SITE_URL: ${SITE_URL:?set the authoritative HTTPS origin}
      DATA_DIR: /data
      HTTP_ADDR: 0.0.0.0:8080
      TEMPLATE_DIR: /app/template
      ADMIN_STATIC_DIR: /app/admin
      SITE_CONFIG_PATH: /app/site-config.json
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?set the observed OpenResty peer IPv4 /32 or IPv6 /128 only}
      PURCHASE_ALLOWED_HOSTS: ${PURCHASE_ALLOWED_HOSTS:-}
      MODEL_PROVIDER: openai
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_MODEL: ${MODEL_MODEL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      GUIDE_IP_RPM: "10"
      GUIDE_MAX_CONCURRENCY: "4"
      BUILD_TIMEOUT: 300s
      BUILD_NODE_HEAP_MB: "512"
      TMPDIR: /data/tmp
      HOME: /data
    volumes:
      - type: bind
        source: ${YUANFA_DATA_DIR:?set an absolute dedicated data directory}
        target: /data
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${YUANFA_HTTP_PORT:-18080}:8080"
