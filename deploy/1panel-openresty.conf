# Add these locations through the 1Panel website's supported configuration UI.
# This is a contract fragment, not a replacement generated server block.
# OpenResty uses host networking; Go stays on its own Compose bridge.
# Set the site's main proxy to http://127.0.0.1:18080 and use the headers below.
# For each isolated instance, replace 18080 in BOTH proxies with YUANFA_HTTP_PORT.
location = /api/guide/messages {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    send_timeout 60s;
    proxy_next_upstream off;
    proxy_ignore_client_abort off;
}
# The normal website reverse proxy location must preserve Go Cache-Control and
# Set-Cookie, disable shared proxy_cache, and use these forwarding headers too.
# Use $http_host in both locations to preserve the original TLS authority's port.
# Do not add default_server or a static root for /data or artifacts.
